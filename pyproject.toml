[project]
name = "radar-bloqueio"
version = "0.1.0"
description = "Radar de bloqueio: risco de bloqueio judicial (SISBAJUD/penhora on-line) contra o cliente réu nos TJs e TRFs"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "httpx>=0.27",
    "selectolax>=0.3",
    "pymupdf>=1.24",
    "openai>=1.40",
    "curl-cffi>=0.16.3",
]

[project.optional-dependencies]
cli = ["python-dotenv>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "python-dotenv>=1.0", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar_bloqueio"]
